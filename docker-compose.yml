services:
  nginx:
    build:
      context: .
      dockerfile: Dockerfile.nginx
    image: potat-nginx-rtmp
    restart: always
    ports:
      - "127.0.0.1:1935:1935"
    volumes:
      - ./streamer.conf:/etc/nginx/nginx.conf:ro

  streamer:
    build:
      context: .
      dockerfile: Dockerfile.streamer
    restart: always
    network_mode: host
    depends_on:
      - nginx
    volumes:
      - ./config.json:/app/config.json:ro
      - ./cookies.json:/app/cookies.json
      - ./image.png:/app/image.png:ro
      - ./music.mp3:/app/music.mp3:ro
